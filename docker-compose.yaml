services:
  app:
    build: .
    container_name: fast_api_water_tank
    # environment:
    #     DATABASE_URL: "sqlite:///./db_water_system.db"
    ports:
      - 80:80
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
  db:
    container_name: postgress_kafka_02
    image: postgres:17-alpine3.22
    environment:
      POSTGRES_USER_FILE: /run/secrets/db_user              
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB_FILE: /run/secrets/db_postgres_db        
      POSTGRES_DB_LOCALHOST: /run/secrets/db_localhost       # db
    secrets:
      - db_password
      - db_user
      - db_postgres_db
      - db_localhost
    healthcheck:        #step which chek if db is already ready to work
      test: ["CMD-SHELL", "pg_isready -U $$(cat $$POSTGRES_USER_FILE)"]   #read user name from file trough bash 
      interval: 3s
      timeout: 3s
      retries: 5

  
  adminer:
    image: adminer
    ports:
      - 8080:8080
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      db:
        condition: service_healthy

secrets:
  db_password:
    file: ./db_password.txt
  db_user:
    file: ./db_user.txt
  db_postgres_db:
    file: ./db_postgress_db_name.txt  
  db_localhost:
    file: ./db_localhost.txt




