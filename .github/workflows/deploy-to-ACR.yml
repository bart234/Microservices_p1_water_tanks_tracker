name: Release to ACR

on:
    workflow_run:
        workflows: ["Microservices pipeline-contract-test-001 pipeline v1"]
        types: 
            - completed

env: 
    ACR_SERVER: ${{ secrets.ACR_SERVER }}

jobs:
  #it setting  variable about which branch was changed   and which run shoule be run
    changes-detection:
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}
        outputs: 
            changed_service: ${{ steps.parse.outputs.services }}
        steps:
            - name: Fetch changed files from GitHub API
              id: parse
              env:
                GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                SHA: ${{ github.event.workflow_run.head_sha }}
              run: |
                # 1. Pobieramy listę zmienionych plików w tym commicie przez API GitHuba
                FILES=$(gh api repos/${{ github.repository }}/commits/$SHA --query "files[].filename" --silent)
                
                # 2. Inicjalizujemy pustą tablicę dla wykrytych serwisów
                SERVICES_ARRAY=()
                
                # 3. Sprawdzamy obecność folderów w ścieżkach plików
                if echo "$FILES" | grep -q "^ServiceNotificationCenter/"; then SERVICES_ARRAY+=('"ServiceNotificationCenter"'); fi
                if echo "$FILES" | grep -q "^ServiceSMS/"; then SERVICES_ARRAY+=('"ServiceSMS"'); fi
                if echo "$FILES" | grep -q "^ServiceTurnOnWaterTank/"; then SERVICES_ARRAY+=('"ServiceTurnOnWaterTank"'); fi
                
                # 4. Formatujemy tablicę do postaci JSON: ["Serwis1", "Serwis2"]
                JSON_OUTPUT=$(echo "${SERVICES_ARRAY[@]}" | sed 's/ /,/g')
                echo "services=[$JSON_OUTPUT]" >> $GITHUB_OUTPUT
                echo "Wykryte usługi do przebudowy: [$JSON_OUTPUT]"
                    
    build-and-push:
        needs: [changes-detection]
        if: ${{ needs.changes-detection.outputs.changed_service != '[]' && needs.changes-detection.outputs.changed_service != '' }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                service_tag: ${{ fromJSON(needs.changes-detection.outputs.changed_service) }}

        steps:
            - name: Repo checkout
              uses: actions/checkout@v4
            
            - name: Log in to ACR
              uses: azure/docker-login@v2
              with:
                login-server: ${{ secrets.ACR_SERVER }}
                username: ${{ secrets.AZURE_ACR_USERNAME }}
                password: ${{ secrets.AZURE_ACR_PASSWORD }}

            - name: Build and tag Docker image
              run: |
                # ACR accept only small letters, convert folder name to lower case
                IMAGE_NAME=$(echo "${{ matrix.service_tag }}" | tr '[:upper:]' '[:lower:]')
                
                docker build -t ${{ env.ACR_SERVER }}/$IMAGE_NAME:latest \
                            -t ${{ env.ACR_SERVER }}/$IMAGE_NAME:${{ github.sha }} \
                            -f ${{ matrix.service_tag }}/Dockerfile ${{ matrix.service_tag }}/

            - name: Push image to ACR
              run: |
                IMAGE_NAME=$(echo "${{ matrix.service_tag }}" | tr '[:upper:]' '[:lower:]')
                
                docker push ${{ env.ACR_SERVER }}/$IMAGE_NAME:latest
                docker push ${{ env.ACR_SERVER }}/$IMAGE_NAME:${{ github.sha }}
