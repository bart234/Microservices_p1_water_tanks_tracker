name: Microservices pipeline-contract-test-001 pipeline v1
#contract-test-1 :path
#water_tank_service in before   -> dummy creation: topic: water_tank_power (in_tempalte -> in)
#                   out         -> front_api_return_msg
#notification_center 
#                   in before   -> dummy creation: topic: notification_service
#                   catch       -> front_api_return_msg
#                   out         -> sms_service.message
#sms_service        
#                   catch       -> sms_service.message
#                   out         -> front_api_message_service
#

on:
  workflow_dispatch:    #run on demand
  push:                 #run after pr to main
    branches:
      - main

jobs:
    #proper test cases
    step-1-water-tank-power-service:
      runs-on: ubuntu-latest
      env:
        SERVICE_DIR: 'ServiceTurnOnWaterTank'
      steps:
          - name: Repo checkout 
            uses: actions/checkout@v4
            
          - name: py init
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
            
          - name: create expected folders and copy dummy input for missing steps (db-to-kafka:topic water_tank_power)
            run: |
             mkdir -p $SERVICE_DIR/tests/pipeline/in/
             mkdir -p $SERVICE_DIR/tests/pipeline/out/
             cp $SERVICE_DIR/tests/pipeline/in_template/contract_test_ke_watertankpower_in.json $SERVICE_DIR/tests/pipeline/in/contract_test_ke_watertankpower_in.json

          - name: py packages
            run: |
              python -m pip install pytest pydantic
              python -m pytest $SERVICE_DIR/tests/pipeline/test_contract_001_testing.py

          # action/upload-artifact@v4 - pack file into folder with same like file name    
          # on next step: use full path where to past it with file at the end
          - name: upload water_tank_power output
            uses: actions/upload-artifact@v4
            with:
              name: water-tank-out-contract-001-step1
              path: ${{ env.SERVICE_DIR }}/tests/pipeline/out/contract_test_ke_front_api_return_msg_out.json
              if-no-files-found: error
                
    
    step-2-notification-center:      
        needs: step-1-water-tank-power-service
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceNotificationCenter'
        steps:
          - name: Repo checkout 
            uses: actions/checkout@v4
            
          - name: py init
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'

          - name:  create expected folders and copy dummy input for missing steps (db-to-kafka:topic notificaiton-center )
            run: |
             mkdir -p $SERVICE_DIR/tests/pipeline/in/
             mkdir -p $SERVICE_DIR/tests/pipeline/out/
             cp $SERVICE_DIR/tests/pipeline/in_template/contract_test_ke_notification_service_in.json $SERVICE_DIR/tests/pipeline/in/contract_test_ke_notification_service_in.json
          
          - name: getting input from water tank power service
            uses: actions/download-artifact@v4
            with:
                name: water-tank-out-contract-001-step1
                #it create folder with artifact name at end of that path 
                path: ${{ env.SERVICE_DIR }}/tests/pipeline/in

          - name: Inspect download folder structure
            run: |
              echo "=== STRUKTURA KATALOGU IN ==="
              ls -R ${{ env.SERVICE_DIR }}/tests/pipeline/in    

          - name: move file form zipped artifact folder to expected one
            run: mv $SERVICE_DIR/tests/pipeline/in/water-tank-out-contract-001-step1/ServiceTurnOnWaterTank/tests/pipeline/out/contract_test_ke_front_api_return_msg_out.json $SERVICE_DIR/tests/pipeline/in/contract_test_ke_front_api_return_msg_in.json
          
          - name: py packages
            run: |
              python -m pip install pytest pydantic
              python -m pytest $SERVICE_DIR/tests/pipeline/test_contract_001_testing.py

          - name: upload water_tank_power output
            uses: actions/upload-artifact@v4
            with:
              name: notification-center-001-step2
              path: ${{ env.SERVICE_DIR }}/tests/pipeline/out/contract_test_ke_contact_message_service_out.json
              if-no-files-found: error
    
    step-3-sms-service:      
        needs: step-2-notification-center
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceSMS'
        steps:
          - name: Repo checkout 
            uses: actions/checkout@v4
            
          - name: py init
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
          - name:  create expected folders
            run: |
             mkdir -p $SERVICE_DIR/tests/pipeline/in/
             mkdir -p $SERVICE_DIR/tests/pipeline/out/  

          - name: getting input from notificetion-center
            uses: actions/download-artifact@v4
            with:
                name: notification-center-001-step2
                path: ${{ env.SERVICE_DIR }}/tests/pipeline/in

          - name: py packages
            run: |
              python -m pip install pytest pydantic
              python -m pytest $SERVICE_DIR/tests/pipeline/test_contract_001_testing.py

    #       - name: upload water_tank_power output
    #         uses: actions/upload-artifact@v4
    #         with:
    #           name: sms-service-001-step2
    #           path: $SERVICE_DIR/tests/pipeline/out/contract_test_ke_contact_message_service_out.json
    #           if-no-files-found: error
