name: Microservices integration-test pipeline v1
#longest - each test will run kafka container
 

on:
  workflow_dispatch:    #run on demand
  workflow_run:
    workflows: ["Microservices pipeline-contract-test-001 pipeline v1"]
    types: 
      - completed

jobs:
    #validation  previous test ersult
    check-success:
      runs-on: ubuntu-latest
      if: ${{ github.event.workflow_run.conclusion == 'success' }}
      steps:
      - name: Previous workflow checked status success
        run: echo "Previous workflow checked status success"

    #proper test cases
    test-water-tank-power-service:
      needs: check-success
      runs-on: ubuntu-latest
      env:
        SERVICE_DIR: 'ServiceTurnOnWaterTank'
      steps:
          - name: Repo checkout 
            uses: actions/checkout@v4
            
          - name: py init
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
              cache: 'pip'
              cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'

          - name: py packages
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r $SERVICE_DIR/requirements.txt --user || true
          
          - name: Run pytest ${{ env.SERVICE_DIR }}
            env:
              PYTHONPATH: ${{ github.workspace }}
            run: |
                python -m pytest $SERVICE_DIR/tests/integration/


    test-notification-center:
        needs: check-success
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceNotificationCenter'
        steps:
            - name: Repo checkout 
              uses: actions/checkout@v4
              
            - name: py init
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'
            
            - name: py packages
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r $SERVICE_DIR/requirements.txt --user || true
            
            - name: Run pytest ${{ env.SERVICE_DIR }}
              env:
                PYTHONPATH: ${{ github.workspace }}
              run: |
                 python -m pytest $SERVICE_DIR/tests/integration/
    
    test-sms-service:
        needs: check-success
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceSMS'
        steps:
            - name: Repo checkout 
              uses: actions/checkout@v4
              
            - name: py init
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'
            
            - name: py packages
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r $SERVICE_DIR/requirements.txt --user || true

            - name: Run pytest ${{ env.SERVICE_DIR }}
              env:
                PYTHONPATH: ${{ github.workspace }}
              run: |
                 python -m pytest $SERVICE_DIR/tests/integration/