name: Microservices integration-test pipeline v1

on:
  workflow_dispatch:    #run on demand
  push:                 #run after pr to main
    branches:
      - main

jobs:
    #proper test cases
    test-water-tank-power-service:
      runs-on: ubuntu-latest
      env:
        SERVICE_DIR: 'ServiceTurnOnWaterTank'
      steps:
          - name: Repo checkout 
            uses: actions/checkout@v4
            
          - name: py init
            uses: actions/setup-python@v5
            with:
              python-version: '3.12'
              cache: 'pip'
              cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'

          - name: py packages
            run: |
              python -m pip install --upgrade pip
              python -m pip install -r $SERVICE_DIR/requirements.txt --user || true
          
          - name: Run pytest ${{ env.SERVICE_DIR }}
            env:
              PYTHONPATH: ${{ github.workspace }}
            run: |
                python -m pytest $SERVICE_DIR/tests/integration/


    test-notification-center:
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceNotificationCenter'
        steps:
            - name: Repo checkout 
              uses: actions/checkout@v4
              
            - name: py init
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'
            
            - name: py packages
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r $SERVICE_DIR/requirements.txt --user || true
            
            - name: Run pytest ${{ env.SERVICE_DIR }}
              env:
                PYTHONPATH: ${{ github.workspace }}
              run: |
                 python -m pytest $SERVICE_DIR/tests/integration/
    
    test-sms-service:
        runs-on: ubuntu-latest
        env:
          SERVICE_DIR: 'ServiceSMS'
        steps:
            - name: Repo checkout 
              uses: actions/checkout@v4
              
            - name: py init
              uses: actions/setup-python@v5
              with:
                python-version: '3.12'
                cache: 'pip'
                cache-dependency-path: '${{ env.SERVICE_DIR }}/requirements.txt'
            
            - name: py packages
              run: |
                python -m pip install --upgrade pip
                python -m pip install -r $SERVICE_DIR/requirements.txt --user || true

            - name: Run pytest ${{ env.SERVICE_DIR }}
              env:
                PYTHONPATH: ${{ github.workspace }}
              run: |
                 python -m pytest $SERVICE_DIR/tests/integration/