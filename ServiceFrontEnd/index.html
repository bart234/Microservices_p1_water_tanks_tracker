<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Kafka Callbacks Stream - </title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f4f9; }
        h1 { color: #333; }
        #log-container { 
            background: #222; color: #0f0; padding: 15px; 
            border-radius: 5px; font-family: monospace; 
            height: 400px; overflow-y: auto; box-shadow: inset 0 0 10px #000;
        }
        .log-entry { margin-bottom: 8px; border-bottom: 1px solid #333; padding-bottom: 4px; }
        .success { color: #00ff00; }
        .error { color: #ff3333; }
    </style>
</head>
<body>
    
    <h1>Statusy wysyłki wiadomości do Kafki</h1>
    <div id="log-container">
        <div class="log-entry">Oczekiwanie na połączenie z serwerem...</div>
    </div>

    <script>
        // we crate ne websocket, which conencts to endpoint from api
        const socket = new WebSocket('ws://127.0.0.1:80/ws/logs');
        const logContainer = document.getElementById('log-container');

        //if messag occure that function catching it na parse
        //topic: service_return_msg
        //fields availible: service_time(timestamp-const),tank_tag(str-const),action(str-variety)

        socket.onmessage = function(event) {
            const data = JSON.parse(event.data);
            console.log(data)
            
            // Tworzymy nowy element logu
            const logEntry = document.createElement('div');
            logEntry.classList.add('log-entry');
                logEntry.innerHTML = `Time: <strong>${data.service_time}</strong> | Tank Tag: ${data.tank_tag} | Action: ${data.action}`;

            // if (data.status === 'success') {
            //     logEntry.innerHTML = `<span class="success">[SUKCES]</span> Klucz: <strong>${data.key}</strong> | Topic: ${data.topic} | Partycja: ${data.partition} | Offset: ${data.offset}`;
            // } else {
            //     logEntry.innerHTML = `<span class="error">[BŁĄD]</span> Klucz: <strong>${data.key}</strong> | Powód: ${data.error}`;
            // }

            //append msg into window 
            logContainer.appendChild(logEntry);
            logContainer.scrollTop = logContainer.scrollHeight;
        };

        socket.onerror = function(error) {
            console.error("Socket connection: error",error);
        };

        socket.onclose = function() {
            console.log("Socket conenction: closed")
        }
    </script>
</body>
</html>
